name: Selenium Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SAUCE_BROWSER: chrome
      SAUCE_HEADLESS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SauceDemo.Automation.csproj

      - name: Build project
        run: dotnet build SauceDemo.Automation.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SauceDemo.Automation.csproj --configuration Release --no-build --verbosity normal